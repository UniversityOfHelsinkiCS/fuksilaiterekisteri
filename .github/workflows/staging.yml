name: Test and build staging-image

on:
  push:
    branches: [master]

jobs:
  test:
    name: "Run linter and Cypress tests"
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: npm ci
        run: npm ci

      - name: install cypress binary
        run: npx cypress install

      - name: npm run lint
        run: npm run lint

      - uses: 1arp/create-a-file-action@0.3
        with:
          path: 'client'
          file: 'outsideGitFakeUsers.json'
          content: |
            []

      - name: docker compose up -d
        run: E2E=true docker compose -f docker-compose-test.yml up -d

      - name: Run cypress tests
        run: ./node_modules/.bin/cypress run

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: /home/runner/work/fuksilaiterekisteri/fuksilaiterekisteri/cypress/screenshots/
      # Test run video was always captured, so this action uses "always()" condition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: /home/runner/work/fuksilaiterekisteri/fuksilaiterekisteri/cypress/videos/

  build:
    name: 'Build and publish staging image'
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' }}

    steps:
      - uses: actions/checkout@v3

      - name: Login to version helsinki
        uses: docker/login-action@v3
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.version.helsinki.fi/toska/openshift/kontit/fuksilaiterekisteri:staging
            registry.version.helsinki.fi/toska/openshift/kontit/fuksilaiterekisteri:${{ github.sha }}
          build-args: |
            BASE_PATH=/fuksilaite/
            GIT_SHA=${{ github.sha }}
            NODE_ENV=staging
            SENTRY_TOKEN=${{ secrets.SENTRY_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Notify failed
        uses:  UniversityOfHelsinkiCS/slackbot-action@v1.3.2
        if: (needs.test.result != 'success' || needs.build.result != 'success')
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          message-type: test-failure

      - name: Notify success
        uses:  UniversityOfHelsinkiCS/slackbot-action@v1.3.2
        if: (needs.test.result == 'success' || needs.build.result == 'success')
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          message-type: deployment
          deployment-target: staging
          softa-url: https://toska-staging.cs.helsinki.fi/fuksilaite/
