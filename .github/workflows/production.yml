name: Build production-image

on:
  release:
    types: [published]

jobs:
  test:
    name: "Run linter and Cypress tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: npm ci
        run: npm ci

      - name: install cypress binary
        run: npx cypress install

      - name: npm run lint
        run: npm run lint

      - uses: 1arp/create-a-file-action@0.3
        with:
          path: 'client'
          file: 'outsideGitFakeUsers.json'
          content: |
            []

      - name: docker compose up -d
        run: E2E=true docker compose -f docker-compose-test.yml up -d

      - name: Run cypress tests
        run: ./node_modules/.bin/cypress run

  build:
    # needs: test # return this after tests fix'd
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to version helsinki
        uses: docker/login-action@v3
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.version.helsinki.fi/toska/openshift/kontit/fuksilaiterekisteri:production
            registry.version.helsinki.fi/toska/openshift/kontit/fuksilaiterekisteri:${{ github.sha }}
          build-args: |
            BASE_PATH=/fuksilaite/
            GIT_SHA=${{ github.sha }}
            NODE_ENV=production

  notify:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Notify failed
        uses:  UniversityOfHelsinkiCS/slackbot-action@v1.4.2
        if: (needs.test.result != 'success' || needs.build.result != 'success')
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          message-type: test-failure
      - name: Notify success
        uses:  UniversityOfHelsinkiCS/slackbot-action@v1.4.2
        if: (needs.test.result == 'success' || needs.build.result == 'success')
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          message-type: deployment
          deployment-target: production
          softa-url: https://study.cs.helsinki.fi/fuksilaite/
